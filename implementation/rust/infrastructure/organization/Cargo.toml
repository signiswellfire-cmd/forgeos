[package]
name = "forgeos-organization-infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
forgeos-organization-domain = { path = "../../domains/organization-domain" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
